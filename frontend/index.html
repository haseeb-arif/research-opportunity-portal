<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Opportunity Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">University Research Opportunity Portal</span>
    </div>
  </nav>

  <main class="container">
    <!-- Success / error messages appear here -->
    <div id="alert-container"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 mb-0">Research Opportunities</h2>
      <button id="btn-new" class="btn btn-primary">+ New Opportunity</button>
    </div>

    <!-- Opportunity cards are rendered here -->
    <div id="opportunities-list" class="row g-3">
      <p class="text-muted">Loading...</p>
    </div>
  </main>

  <!-- Details modal -->
  <div class="modal fade" id="detailsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="details-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="details-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Back</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
